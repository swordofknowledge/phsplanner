<div class="top"><header><div class="brand"><div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></svg></div><div>PHS Planner<small>Poolesville High School</small></div></div><div class="sp"></div><div class="pill" id="acct">…</div><button id="snd" onclick="sndTog()">Sound off</button><button id="lo" onclick="logout()">Sign out</button><div class="pill" id="strk">Streak 0</div></header>

<script>

let S={prof:{name:'',id:'',grade:'',counselor:'',locker:'',email:''},classes:{},tasks:[],rems:[],stats:{n:0,streak:0,last:''}};
let tab='today',cal={y:new Date().getFullYear(),m:new Date().getMonth(),s:dk(new Date())},ref=null,mode='focus',T={left:1500,run:false,end:0,cyc:0,task:''};

function start(u,mode,data){USER=u;MODE=mode;KEY=mode=='local'?'phs-planner:'+u.toLowerCase():null;ref=mode=='cloud'?cloud.ref:null;S=Object.assign(JSON.parse(S0),data||{});if(!S.prof.email)S.prof.email=u;S.tasks.forEach(t=>{if(!t.st)t.st=t.done?'done':'todo'});lbs();{const pal=['#4f9cf9','#ff6b7a','#3ddc97'],gone=S.labels.filter(l=>['Homework','Test','Project'].includes(l.n)&&pal.includes(String(l.c).toLowerCase())).map(l=>l.id);if(gone.length){S.labels=S.labels.filter(l=>!gone.includes(l.id));S.tasks.forEach(t=>{if(gone.includes(t.lb))t.lb=''})}}applyTheme();try{localStorage.setItem('phs-session',JSON.stringify({u,mode}))}catch(e){}
document.body.classList.remove('out');$('acct').textContent=u.split('@')[0]+(mode=='cloud'?' · synced':' · this device');tab='today';render()}

cal(){const f=new Date(cal.y,cal.m,1),n=new Date(cal.y,cal.m+1,0).getDate(),td=dk(new Date());let h=['Su','Mo','Tu','We','Th','Fr','Sa'].map(d=>`<div class="h">${d}</div>`).join('')+'<div style="visibility:hidden"></div>'.repeat(f.getDay());

<div class="card"><h2>${cal.s}</h2>${ts.map(taskRow).join('')}${rs.map(r=>`<div class="it"><div class="g"><b>${esc(r.t)}</b><div class="mut">${r.tm||'All day'}</div></div><button class="x" onclick="delR('${r.id}')">✕</button></div>`).join('')}${ts.length+rs.length?'':'<p class="mut">Nothing scheduled.</p>'}
<div class="row" style="margin-top:10px"><input id="qt" placeholder="Add a deadline for this day" style="flex:1"><button class="pri" onclick="addQ()">Add</button></div></div>`},
timer(){const o=open_();return`<div class="card c"><div class="row" style="justify-content:center">${[['focus','Focus'],['short','Short Break'],['long','Long Break']].map(([k,l])=>`<button class="${mode==k?'on':''}" onclick="setM('${k}')">${l}</button>`).join('')}</div><div class="ring" id="trg" style="--p:${(DUR[mode]-T.left)/DUR[mode]*100};margin:18px auto"><div class="rin"><div class="big" id="tm">${fmt(T.left)}</div></div></div><div class="row" style="justify-content:center"><button class="pri" id="tgo" onclick="tgl()">${T.run?'Pause':'Start'}</button><button onclick="setM(mode)">Reset</button></div>

study(){S.cards=S.cards||[];return V.timer()+tkCards()+`<div class="card"><h2>Study hack</h2><div class="tip" id="tipb">${tipH()}</div><div class="row" style="margin-top:12px"><button onclick="tipN()">Another tip</button></div><p class="mut" style="margin-top:12px">Picked from popular study-hack roundups, keeping the ones that hold up against learning research.</p></div>

theme(){S.themes=S.themes||[];const cur=S.theme||'rainbow',v=S.vol||{a:.6,b:.4};return`<div class="card"><h2>Themes and soundscapes</h2><p class="mut">Each theme changes the look and plays its own ambience with a binaural beat. Use headphones so the beat works. Everything is generated live in your browser, so there is nothing to download.</p>
<div class="tl" style="margin-top:14px">${allT().map(t=>`<button class="thm ${t.id==cur?'on':''}" onclick="setTheme('${t.id}')"><i class="sw" style="background:${t.bg?col(t.a):'conic-gradient(#e53935,#fb8c00,#fdd835,#43a047,#1e88e5,#e53935)'}"></i><b>${esc(t.n)}</b><span class="mut">${AMBS[t.amb]} · ${BANDS[t.band][0]} ${BANDS[t.band][1]} Hz</span></button>`).join('')}</div>
<div class="row" style="margin-top:16px"><button class="pri" id="snd2" onclick="sndTog()">${SND?'Stop sound':'Play sound'}</button><label>Ambience<input type="range" min="0" max="1" step=".05" value="${v.a}" oninput="setVol('a',this.value)"></label><label>Beat<input type="range" min="0" max="1" step=".05" value="${v.b}" oninput="setVol('b',this.value)"></label></div></div>

<div class="row" style="margin-top:12px"><label>Background<input id="cbg" type="color" value="#0b1220"></label><label>Accent<input id="cac" type="color" value="#1e88e5"></label><label>Glow<input id="cgl" type="color" value="#0f6f8f"></label><button class="pri" onclick="saveTheme()">Save theme</button></div>
${S.themes.length?`<div class="row" style="margin-top:14px">${S.themes.map(t=>`<span class="chip">${esc(t.n)}<button class="x" onclick="delTheme('${t.id}')">✕</button></span>`).join('')}</div>`:''}</div>`},
prof(){const P=S.prof,F=(k,l,t)=>`<label>${l}<input ${t||''} value="${esc(P[k])}" onchange="S.prof['${k}']=this.value;save()"></label>`;

const TIPS=[["Active recall","Close your notes and write down everything you remember, then check what you missed."],["Spaced repetition","Quiz yourself today, again in a few hours, and once more the next morning."],["Pomodoro","Work in focused blocks with short breaks. The timer above does it for you."],["Study together","Join a virtual study room. Knowing others are working keeps you from procrastinating."],["Understand, do not copy","Answer websites fix tonight but hurt later. Try the problem first, then check."],["Keep it simple","Skip overly complex spreadsheets and planners. A short list you actually use wins."],["Teach it","Explain the topic out loud as if to a younger student. Where you stumble is what to review."],["Mix it up","Alternate problem types instead of doing one kind in a row. It feels harder and works better."],["Phone away","Put your phone in another room during a focus block."],["Practice, not rereading","Do practice problems or old quizzes instead of rereading your notes."],["Sleep on it","Sleep helps lock in what you studied. Do not cram all night."],["Hardest first","Start with the toughest subject while your energy is high."]];
const TOOLS=[["Quizlet","https://quizlet.com","AI flashcards and practice tests from your notes."],["Anki","https://apps.ankiweb.net","Spaced-repetition flashcards. Free on desktop."],["RemNote","https://www.remnote.com","Notes that turn into flashcards, even from diagrams."],["YouLearn","https://www.youlearn.ai","Flashcards, quizzes and practice tests from PDFs, slides and videos."],["NotebookLM","https://notebooklm.google.com","Ask questions about your own uploaded notes and sources."]];

return`<div class="fc" onclick="fc.f=!fc.f;fcR()"><div class="mut">Card ${fc.i+1} of ${c.length} · tap to flip</div><div class="fct">${esc(fc.f?k.a:k.q)}</div></div><div class="row" style="justify-content:center;margin-top:12px"><button onclick="fcGo(-1)">Back</button><button class="pri" onclick="fcGo(1)">Next</button><button onclick="fcShuf()">Shuffle</button><button onclick="fcDel('${k.id}')">Delete card</button></div>`}

const allT=()=>THEMES.concat(S.themes||[]);
function applyTheme(){const t=allT().find(x=>x.id==S.theme)||THEMES[0],r=document.documentElement.style;
const K=['--bg','--ac','--ac2','--ac3','--o1','--o2','--o3','--tx','--mut','--card','--card2','--bd','--hl','--in'];
if(!t.bg){K.forEach(k=>r.removeProperty(k));return}
const o=t.o.map(col),V={'--bg':col(t.bg),'--ac':col(t.a),'--ac2':col(t.a),'--ac3':o[2],'--o1':o[0]+'99','--o2':o[1]+'99','--o3':o[2]+'77','--tx':'#f4f2fb','--mut':'#b3aec6','--card':'rgba(255,255,255,.07)','--card2':'rgba(255,255,255,.12)','--bd':'rgba(255,255,255,.12)','--hl':'rgba(255,255,255,.2)','--in':'rgba(255,255,255,.08)'};
for(const k in V)r.setProperty(k,V[k])}
let AC=null,SND=null;const NB={};
function nz(type){const r=AC.sampleRate;if(!NB[type]){const n=2*r,b=AC.createBuffer(1,n,r),d=b.getChannelData(0);let l=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;if(type=='brown'){l=(l+.02*w)/1.02;d[i]=l*3.5}else d[i]=w}NB[type]=b}const s=AC.createBufferSource();s.buffer=NB[type];s.loop=true;return s}
const flt=(t,f,q)=>{const x=AC.createBiquadFilter();x.type=t;x.frequency.value=f;if(q)x.Q.value=q;return x};
const gn=v=>{const g=AC.createGain();g.gain.value=v;return g};
function chain(s,...a){let c=s;a.forEach(x=>{c.connect(x);c=x});return c}
function lfo(f,d,tg,n){const o=AC.createOscillator(),g=gn(d);o.frequency.value=f;o.connect(g);g.connect(tg);o.start();n.push(o)}
function ping(o,f,v){const x=AC.createOscillator(),g=gn(0),t=AC.currentTime;x.frequency.value=f;x.connect(g);g.connect(o);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.35);x.start();x.stop(t+.4)}
function crk(o){const s=nz('white'),g=gn(0),t=AC.currentTime,v=.05+Math.random()*.25;chain(s,flt('highpass',1800+Math.random()*2000),g).connect(o);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.04);s.start();s.stop(t+.06)}
const AMB={
rain(o,n){const a=nz('white'),b=nz('brown');a.start();b.start();n.push(a,b);chain(a,flt('highpass',900),flt('lowpass',9000),gn(.22)).connect(o);chain(b,flt('lowpass',350),gn(.6)).connect(o)},
cafe(o,n,t){const a=nz('brown'),c=nz('white'),g=gn(.9);a.start();c.start();n.push(a,c);chain(a,flt('bandpass',550,.6),g).connect(o);lfo(.15,.3,g.gain,n);chain(c,flt('bandpass',1800,.8),gn(.03)).connect(o);t.push(setInterval(()=>{if(Math.random()<.6)ping(o,1800+Math.random()*1800,.05)},2500))},
ocean(o,n){const a=nz('brown'),w=nz('white'),g=gn(.5),h=gn(.03);a.start();w.start();n.push(a,w);chain(a,flt('lowpass',700),g).connect(o);lfo(.09,.4,g.gain,n);chain(w,flt('highpass',2500),h).connect(o);lfo(.09,.03,h.gain,n)},
forest(o,n){const a=nz('brown');a.start();n.push(a);chain(a,flt('lowpass',450),gn(.35)).connect(o);[4300,4700].forEach((f,i)=>{const x=AC.createOscillator(),g=gn(.012);x.frequency.value=f;x.connect(g);g.connect(o);x.start();n.push(x);lfo(13+i*2,.012,g.gain,n)})},
fire(o,n,t){const a=nz('brown');a.start();n.push(a);chain(a,flt('lowpass',500),gn(.7)).connect(o);t.push(setInterval(()=>{if(Math.random()<.7)crk(o)},140))},
room(o,n){const a=nz('brown');a.start();n.push(a);chain(a,flt('lowpass',220),gn(.45)).connect(o)}};
function sndBtn(){['snd','snd2'].forEach(i=>{const b=$(i);if(b)b.textContent=i=='snd'?(SND?'Sound on':'Sound off'):(SND?'Stop sound':'Play sound')})}
function sndStart(){if(SND)return;const t=allT().find(x=>x.id==S.theme)||THEMES[0],v=S.vol||{a:.6,b:.4};
try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){return toast('Sound is not supported here.')}
const n=[],tm=[],m=gn(1),av=gn(v.a),bv=gn(v.b),mg=AC.createChannelMerger(2);m.connect(AC.destination);av.connect(m);bv.connect(m);
const f=BANDS[t.band]?BANDS[t.band][1]:10;[0,f].forEach((d,i)=>{const o=AC.createOscillator(),g=gn(.25);o.frequency.value=200+d;o.connect(g);g.connect(mg,0,i);o.start();n.push(o)});mg.connect(bv);
if(AMB[t.amb])AMB[t.amb](av,n,tm);SND={n,tm,m,av,bv};sndBtn()}
function sndStop(){if(!SND)return;SND.tm.forEach(clearInterval);SND.n.forEach(x=>{try{x.stop()}catch(e){}});try{SND.m.disconnect()}catch(e){}SND=null;sndBtn()}
function sndTog(){SND?sndStop():sndStart()}
function setTheme(id){S.theme=id;save();const p=!!SND;sndStop();applyTheme();if(p)sndStart();render()}
function setVol(k,v){S.vol=S.vol||{a:.6,b:.4};S.vol[k]=+v;save();if(SND)(k=='a'?SND.av:SND.bv).gain.value=+v}
function saveTheme(){const n=$('cn').value.trim(),a=$('ca').value,b=$('cb').value;if(!n||!AMBS[a]||!BANDS[b])return toast('Give your theme a name.');const id=uid(),gl=$('cgl').value,ac=$('cac').value;S.themes=S.themes||[];S.themes.push({id,n:n.slice(0,24),amb:a,band:b,bg:$('cbg').value,a:ac,o:[gl,ac,gl]});save();setTheme(id)}
function delTheme(id){S.themes=(S.themes||[]).filter(t=>t.id!=id);if(S.theme==id){S.theme='rainbow';sndStop();applyTheme()}save();render()}
function render(){if(!USER)return showLogin();nav();$('main').innerHTML=V[tab]();$('strk').textContent='Streak '+S.stats.streak;tick()}
function delR(id){S.rems=S.rems.filter(x=>x.id!=id);save();render()}
function addR(){const t=$('rt').value.trim();if(!t)return;S.rems.push({id:uid(),t,d:$('rd').value,tm:$('rm').value,f:0});save();render()}
function setC(i,k,v){S.classes[i]=Object.assign(S.classes[i]||{},{[k]:v});save()}
function cm(d){cal.m+=d;if(cal.m<0){cal.m=11;cal.y--}if(cal.m>11){cal.m=0;cal.y++}render()}
function setM(m){mode=m;T.run=false;T.left=DUR[m];if(tab=='study')render()}
function tgl(){T.run=!T.run;if(T.run)T.end=Date.now()+T.left*1000;if(tab=='study')render()}
function done(){T.run=false;if(mode=='focus'){const td=dk(new Date()),y=new Date(Date.now()-864e5);S.stats.n++;if(S.stats.last!=td){S.stats.streak=S.stats.last==dk(y)?S.stats.streak+1:1;S.stats.last=td}T.cyc++;save();toast('Focus session done! Take a break.');mode=T.cyc%4?'short':'long'}else{toast('Break over. Ready to focus?');mode='focus'}T.left=DUR[mode];beep();render()}
function beep(){try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=660;o.start();o.stop(a.currentTime+.4)}catch(e){}}
function tick(){if(USER&&!T.run&&Date.now()-last>18e5){toast('Signed out after 30 minutes of inactivity.');return logout()}const d=new Date(),s=d.getHours()*3600+d.getMinutes()*60+d.getSeconds(),wd=d.getDay()>0&&d.getDay()<6;
if(T.run){T.left=Math.ceil((T.end-Date.now())/1000);if(T.left<=0)return done();document.title=fmt(T.left)+' · PHS Planner';if($('tm'))$('tm').textContent=fmt(T.left);if($('trg'))$('trg').style.setProperty('--p',(DUR[mode]-T.left)/DUR[mode]*100)}else document.title='PHS Planner';
S.rems.forEach(r=>{if(!r.f&&r.tm&&r.d==dk(d)&&r.tm<=p2(d.getHours())+':'+p2(d.getMinutes())){r.f=1;save();toast('Reminder: '+r.t)}});
PER.forEach((p,i)=>{const e=$('pr'+i);if(e)e.className=wd&&s>=p.a&&s<p.b?'cur':''});
if(!$('cclk'))return;let st='',big='',nx='',pc=0;
if(!wd){st='Weekend';big='No school';nx='Enjoy your break!'}
else{const c=PER.findIndex(p=>s>=p.a&&s<p.b),n=PER.find(p=>p.a>s);
if(c>=0){const p=PER[c];st=p.n+(cname(c)?' · '+esc(cname(c)):'');big=fmt(p.b-s);nx=n?'Next: '+n.n+' at '+f12(n.s):'Last period of the day';pc=(s-p.a)/(p.b-p.a)*100}
else if(n){const b=PER[PER.indexOf(n)-1];st=b?'Passing time':'Before school';big=fmt(n.a-s);nx='Until '+n.n+' ('+f12(n.s)+')';pc=b?(s-b.b)/(n.a-b.b)*100:0}
else{st='School day is over';big='Done ✓';nx='Time to study or relax'}}
$('cst').innerHTML=st;$('cclk').textContent=big;$('cnx').textContent=nx;$('crg').style.setProperty('--p',pc)}
boot();setInterval(tick,1000);
</script></body></html>
